#
# Exercises the GPU identity telemetry attributes against a mock BMC.
# Start the mock first:
#
#   cargo run -p bmc-mock -- --hardware-profile nvidia_dgx_h100 \
#       --machine-role host --state-backend internal --port 18443
#
# Then drive an SSE log record for a specific GPU slot:
#
#   curl -sk -X POST -H 'Content-Type: application/json' \
#     -d '{"MessageId":"Nvidia.1.0.XidError","Message":"Xid 79",
#          "MessageSeverity":"Critical",
#          "OriginOfCondition":{"@odata.id":"/redfish/v1/Chassis/HGX_GPU_SXM_3"}}' \
#     https://127.0.0.1:18443/redfish/v1/EventService/Actions/EventService.SubmitTestEvent
#
# Sensor metrics for GPU chassis and that log record both carry gpu_uuid,
# gpu_serial, gpu_chassis_serial, and gpu_model.

[[endpoint_sources.static_bmc_endpoints]]
ip = "127.0.0.1"
port = 18443
mac = "aa:bb:cc:dd:ee:ff"
username = "admin"
password = "secret"
rack_id = "RACK_1"
machine = { id = "fm100htjtiaehv1n5vh67tbmqq4eabcjdng40f7jupsadbedhruh6rag1l0", serial = "MN-001", slot_number = 15, tray_index = 5 }

[endpoint_sources.nico_api]
enabled = false

# Opt-in. Turning this off removes the gpu_* labels from every metric datapoint
# and log record, and skips the PCIe traversal that resolves them.
[attributes]
gpu_identity = true

[collectors.discovery]
refresh_interval = "5m"
discovery_concurrency = 1

[collectors.reachability]
enabled = false

[collectors.sensors]
sensor_fetch_interval = "15s"
include_sensor_thresholds = false

[collectors.metrics]
enabled = false

[collectors.firmware]
firmware_refresh_interval = "30m"

[collectors.logs]
mode = "sse"

[collectors.logs.sse]
initial_backoff = "1s"
max_backoff = "10s"

[sinks.tracing]
enabled = true

[sinks.prometheus]
enabled = true

[sinks.health_report]
enabled = false

[sinks.rack_health_report]
enabled = false

[sinks.switch_health_report]
enabled = false

[sinks.power_shelf_health_report]
enabled = false

[metrics]
endpoint = "127.0.0.1:19009"
